<style>
:root{--bg:#EEF2F1;--sf:#fff;--tx:#12201E;--mu:#6B7C79;--ln:#DCE5E3;--ac:#0E9F8E;--bad:#D9483B;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0E1615;--sf:#17221F;--tx:#E8F0EE;--mu:#8FA29E;--ln:#25332F;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0E1615;--sf:#17221F;--tx:#E8F0EE;--mu:#8FA29E;--ln:#25332F;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font-family:Vazirmatn,Tahoma,system-ui,sans-serif;font-size:15px;line-height:1.7;padding-bottom:96px}
main{max-width:520px;margin:0 auto;padding:16px}
h1{font-size:20px;margin:4px 0 14px;font-weight:800}
h2{font-size:15px;margin:20px 0 8px;font-weight:600;color:var(--mu)}
.card{background:var(--sf);border:1px solid var(--ln);border-radius:16px;padding:14px;margin-bottom:12px}
.big{font-size:34px;font-weight:800;line-height:1.3}
.mu{color:var(--mu);font-size:13px}
.row{display:flex;align-items:center;gap:10px}
.sp{justify-content:space-between}
.bar{height:8px;background:var(--ln);border-radius:8px;overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;background:var(--ac);border-radius:8px}
.bar.w i{background:var(--bad)}
.tx{padding:10px 0;border-bottom:1px solid var(--ln)}
.tx:last-child{border:0}
.ic{width:40px;height:40px;border-radius:12px;background:var(--bg);display:grid;place-items:center;font-size:20px;flex:none}
.grow{flex:1;min-width:0}
.nt{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
nav{position:fixed;bottom:0;inset-inline:0;background:var(--sf);border-top:1px solid var(--ln);display:flex;justify-content:space-around;padding:8px 8px calc(8px + env(safe-area-inset-bottom,0px));z-index:5}
nav button{background:none;border:0;color:var(--mu);font:inherit;font-size:12px;display:grid;justify-items:center;gap:0;padding:4px 6px;cursor:pointer}
nav button b{font-size:20px;font-weight:400}
nav button.on{color:var(--ac);font-weight:600}
.fab{position:fixed;bottom:calc(58px + env(safe-area-inset-bottom,0px));inset-inline-start:18px;width:58px;height:58px;border-radius:50%;border:0;background:var(--ac);color:#fff;font-size:30px;box-shadow:0 6px 18px rgba(0,0,0,.25);z-index:6;cursor:pointer}
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:10;display:none;align-items:flex-end}
.sheet.on{display:flex}
.pane{background:var(--bg);width:100%;max-width:520px;margin:0 auto;border-radius:22px 22px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px));max-height:94vh;overflow:auto}
#amt{width:100%;border:0;background:none;color:var(--tx);font:inherit;font-size:44px;font-weight:800;text-align:center;outline:0;direction:ltr}
input,select,textarea{font:inherit;color:var(--tx);background:var(--sf);border:1px solid var(--ln);border-radius:12px;padding:10px 12px;width:100%}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:10px 0}
.cat{background:var(--sf);border:2px solid transparent;border-radius:14px;padding:8px 2px;text-align:center;font-size:12px;cursor:pointer;color:var(--tx);font-family:inherit}
.cat b{display:block;font-size:24px;font-weight:400}
.cat.on{border-color:var(--ac)}
.btn{background:var(--ac);color:#fff;border:0;border-radius:14px;padding:13px;width:100%;font:inherit;font-weight:600;font-size:16px;cursor:pointer;margin-top:10px}
.btn.g{background:var(--sf);color:var(--tx);border:1px solid var(--ln)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0}
.chip{background:var(--sf);border:1px solid var(--ln);border-radius:20px;padding:3px 12px;font-size:13px;cursor:pointer;color:var(--tx);font-family:inherit}
.chip.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.cols{display:flex;align-items:flex-end;gap:6px;height:110px;margin-top:10px}
.cols div{flex:1;text-align:center;font-size:11px;color:var(--mu);display:flex;flex-direction:column;justify-content:flex-end;height:100%}
.cols i{display:block;background:var(--ac);border-radius:6px 6px 2px 2px;min-height:2px;margin-bottom:4px}
.sw{width:34px;height:34px;border-radius:50%;border:3px solid transparent;cursor:pointer}
.sw.on{border-color:var(--tx)}
.toast{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));inset-inline:16px;margin:auto;max-width:400px;background:var(--tx);color:var(--bg);padding:10px 14px;border-radius:12px;z-index:20;text-align:center;display:none}
.empty{text-align:center;color:var(--mu);padding:26px 8px}
.del{background:none;border:0;color:var(--mu);font-size:18px;cursor:pointer}
.card input+input{margin-top:6px}
</style>
</head>

<script>

const inMonth=(t,d=new Date())=>mk(new Date(t.t))===mk(d);
const sum=a=>a.reduce((x,t)=>x+t.a,0);
function row(t){const c=catOf(t.c),d=new Date(t.t);return `<div class="tx row"><div class="ic">${c.e}</div><div class="grow"><div class="nt">${t.n||c.n}</div><div class="mu">${c.n} - ${ftime(d)}</div></div><b>${fa(t.a)}</b><button class="del" data-d="${t.id}" aria-label="حذف">✕</button></div>`}
function home(){
const now=new Date(),td=S.tx.filter(t=>dk(new Date(t.t))===dk(now)),mo=S.tx.filter(t=>inMonth(t)),m=sum(mo),b=+S.s.budget;
const h=now.getHours(),g=h<5?'شب بخیر':h<12?'صبح بخیر':h<18?'عصر بخیر':'شب بخیر';
let o=`<div class="row" style="margin-bottom:8px"><img src="${ICON}" width="34" height="34" alt=""><b style="font-size:18px">Mbook</b></div><h1>${g}</h1>`+alerts()+`<div class="card"><div class="mu">خرج امروز</div><div class="big">${fa(sum(td))} <span class="mu">${U()}</span></div></div>`;
o+=`<div class="card"><div class="row sp"><span class="mu">خرج این ماه</span><b>${fa(m)} ${U()}</b></div>`;
if(b>0){const p=Math.min(100,m/b*100);o+=`<div class="bar ${m>b?'w':''}"><i style="width:${p}%"></i></div><div class="mu" style="margin-top:6px">${m>b?'از بودجه '+fa(m-b)+' بیشتر شده':fa(b-m)+' از بودجه مانده'}</div>`}else o+=`<div class="mu">برای کنترل خرج، در تنظیمات بودجه ماهانه بگذار.</div>`;
o+=`</div><h2>آخرین ثبت‌ها</h2><div class="card">`;
const rec=[...S.tx].sort((a,b)=>b.t-a.t).slice(0,25);
if(!rec.length)o+=`<div class="empty">هنوز چیزی ثبت نکردی.<br>دکمه + را بزن و اولین خرجت را بنویس.</div>`;
let last='';rec.forEach(t=>{const d=fdate(new Date(t.t));if(d!==last){o+=`<div class="mu" style="padding-top:8px">${d}</div>`;last=d}o+=row(t)});
return o+'</div>'}
function stats(){
const now=new Date();let list,days;
if(range==='week'){days=7;const s=new Date(now);s.setDate(s.getDate()-6);s.setHours(0,0,0,0);list=S.tx.filter(t=>t.t>=+s)}
else{days=pj(now).day;list=S.tx.filter(t=>inMonth(t))}
const tot=sum(list);
let o=`<h1>تحلیل خرج</h1><div class="chips"><button class="chip ${range==='week'?'on':''}" data-r="week">۷ روز اخیر</button><button class="chip ${range==='month'?'on':''}" data-r="month">این ماه</button></div>`;
o+=`<div class="card"><div class="mu">جمع خرج</div><div class="big">${fa(tot)} <span class="mu">${U()}</span></div><div class="mu">میانگین روزانه: ${fa(tot/days)} ${U()}</div>`;
const n=Math.min(days,14),cols=[];for(let i=n-1;i>=0;i--){const d=new Date(now);d.setDate(d.getDate()-i);cols.push({l:d.toLocaleDateString('fa-IR',{weekday:'narrow'}),v:sum(S.tx.filter(t=>dk(new Date(t.t))===dk(d)))})}
const mx=Math.max(1,...cols.map(c=>c.v));
o+=`<div class="cols">${cols.map(c=>`<div><i style="height:${c.v/mx*80}px"></i>${c.l}</div>`).join('')}</div></div>`;
const by={};list.forEach(t=>by[t.c]=(by[t.c]||0)+t.a);
const arr=Object.entries(by).sort((a,b)=>b[1]-a[1]);
o+=`<h2>به تفکیک دسته</h2><div class="card">`;
if(!arr.length)o+=`<div class="empty">برای این بازه داده‌ای نیست.</div>`;
arr.forEach(([id,v])=>{const c=catOf(id),p=v/tot*100;o+=`<div style="margin:8px 0"><div class="row sp"><span>${c.e} ${c.n}</span><span class="mu">${fa(v)} - ${fa(p)}٪</span></div><div class="bar"><i style="width:${p}%"></i></div></div>`});
o+='</div>';
const ins=[];
if(arr.length)ins.push(`بیشترین خرج: ${catOf(arr[0][0]).n} (${fa(arr[0][1]/tot*100)}٪ از کل).`);
if(range==='month'){const pd=new Date(now);pd.setDate(1);pd.setDate(0);const pm=sum(S.tx.filter(t=>inMonth(t,pd)));if(pm>0){const df=(tot-pm)/pm*100;ins.push(`ماه قبل ${fa(pm)} ${U()} خرج کردی. تا همین‌جا ${fa(Math.abs(df))}٪ ${df>=0?'بیشتر':'کمتر'} است.`)}
const pr=tot/days*30;if(tot>0)ins.push(`با این روند، آخر ماه حدود ${fa(pr)} ${U()} می‌شود.`);}
const big=[...list].sort((a,b)=>b.a-a.a)[0];if(big)ins.push(`بزرگ‌ترین خرج: ${big.n||catOf(big.c).n} به مبلغ ${fa(big.a)}.`);
if(ins.length)o+=`<h2>نکته‌ها</h2><div class="card">${ins.map(i=>`<div style="margin:6px 0">💡 ${i}</div>`).join('')}</div>`;
return o}
const SW=['#0E9F8E','#2F6FDE','#8A4FD8','#E0568B','#E08A1E','#3E8E41'];
function sett(){const s=S.s;
return `<h1>تنظیمات</h1><div class="card"><div class="mu">ظاهر</div><div class="chips">${[['auto','خودکار'],['light','روشن'],['dark','تیره']].map(([k,l])=>`<button class="chip ${s.theme===k?'on':''}" data-th="${k}">${l}</button>`).join('')}</div>
<div class="row" style="margin-top:8px">${SW.map(c=>`<div class="sw ${s.ac===c?'on':''}" data-ac="${c}" style="background:${c}"></div>`).join('')}</div></div>
<div class="card"><div class="mu">بودجه ماهانه (${U()})</div><input id="bud" inputmode="numeric" value="${s.budget?fa(s.budget):''}" placeholder="مثلاً ۵٬۰۰۰٬۰۰۰"><div class="mu" style="margin-top:10px">واحد پول</div><input id="unit" value="${s.unit}"></div>
<div class="card"><div class="mu">ساعت یادآوری اقساط و قرض‌ها</div><input type="time" id="it" value="${s.itime}"></div>
<div class="card"><div class="row sp"><span>یادآوری روزانه</span><input type="checkbox" id="rem" ${s.remind?'checked':''} style="width:24px;height:24px"></div><input type="time" id="rt" value="${s.rtime}" style="margin-top:8px"><div class="mu" style="margin-top:6px">اعلان فقط وقتی کار می‌کند که برنامه باز یا در پس‌زمینه باشد.</div></div>
<div class="card"><div class="mu">دسته‌ها</div><div class="chips">${S.cats.map(c=>`<span class="chip">${c.e} ${c.n}</span>`).join('')}</div>
<div class="row" style="margin-top:8px"><input id="ne" placeholder="😀" style="width:70px"><input id="nn" placeholder="نام دسته جدید"></div><button class="btn g" id="addc">افزودن دسته</button></div>
<div class="card"><div class="mu">پشتیبان‌گیری</div><button class="btn g" id="bk">کپی پشتیبان</button><button class="btn g" id="rs">بازیابی از متن کپی‌شده</button><button class="btn g" id="clr" style="color:var(--bad)">پاک کردن همه ثبت‌ها</button></div>`}
function sync(){try{if(window.Android){const n=new Date();Android.sync(fa(sum(S.tx.filter(t=>dk(new Date(t.t))===dk(n)))),fa(sum(S.tx.filter(t=>inMonth(t)))))}}catch(e){}}
function render(){sync();theme();$('#app').innerHTML=view==='home'?home():view==='stats'?stats():view==='debt'?debts():view==='inst'?insts():sett();document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.v===view));window.scrollTo(0,0)}
const MN=864e5;
let ddir='gave';
const sl=a=>a.reduce((s,x)=>s+x.left,0);
const fd=d=>new Intl.DateTimeFormat('fa-IR-u-ca-persian',{day:'numeric',month:'long'}).format(d);
const lt=l=>l<0?fa(-l)+' روز گذشته':l===0?'امروز':l===1?'فردا':fa(l)+' روز دیگر';
const noon=()=>{const n=new Date();n.setHours(12,0,0,0);return n};
function matchDay(d,day){const p=pj(d),n=pj(new Date(+d+MN));return p.day===day||(n.month!==p.month&&day>p.day)}
function nextDue(i){const now=noon(),p=pj(now);i.paid=i.paid||[];
for(let k=-(p.day-1);k<75;k++){const d=new Date(+now+k*MN);if(matchDay(d,i.day)&&!i.paid.includes(mk(d)))return d}return null}
function dueList(){const now=noon(),r=[];
S.inst.forEach(i=>{const d=nextDue(i);if(d){const l=Math.round((d-now)/MN);if(l<=3)r.push({t:'قسط '+i.bank,a:i.a,l})}});
S.debts.forEach(x=>{if(x.due&&x.left>0){const l=Math.round((new Date(x.due+'T12:00:00')-now)/MN);if(l<=3)r.push({t:(x.dir==='gave'?'پس گرفتن از ':'پس دادن به ')+x.who,a:x.left,l})}});
return r.sort((a,b)=>a.l-b.l)}
function alerts(){const r=dueList();if(!r.length)return '';
return `<div class="card" style="border-color:var(--bad)"><b>⏰ سررسیدهای نزدیک</b>${r.map(x=>`<div class="row sp" style="margin-top:6px"><span>${x.t}</span><span style="${x.l<0?'color:var(--bad)':'color:var(--mu)'}">${fa(x.a)} - ${lt(x.l)}</span></div>`).join('')}</div>`}
function dueCheck(hm,n){if(hm!==S.s.itime||S.s.lastI===dk(n))return;S.s.lastI=dk(n);save();const r=dueList();if(r.length)notify('سررسید نزدیک',r.map(x=>x.t+' ('+lt(x.l)+')').join('، '))}
function debts(){const act=S.debts.filter(x=>x.left>0),old=S.debts.filter(x=>x.left<=0);
const g=sl(act.filter(x=>x.dir==='gave')),b=sl(act.filter(x=>x.dir==='got'));
const R=x=>`<div class="tx row"><div class="ic">${x.dir==='gave'?'📤':'📥'}</div><div class="grow"><div class="nt">${x.who}</div><div class="mu">${x.dir==='gave'?'قرض دادم':'قرض گرفتم'} - ${fd(new Date(x.t))}${x.due?' - موعد: '+fd(new Date(x.due+'T12:00:00')):''}${x.note?' - '+x.note:''}</div></div><div style="text-align:left"><b>${fa(x.left>0?x.left:x.a)}</b>${x.left>0?`<br><button class="chip" data-pay="${x.id}">تسویه</button>`:''}</div><button class="del" data-dd="${x.id}">✕</button></div>`;
let o=`<h1>قرض و طلب</h1><div class="grid" style="grid-template-columns:1fr 1fr"><div class="card" style="margin:0"><div class="mu">باید بگیرم</div><b style="font-size:20px">${fa(g)}</b></div><div class="card" style="margin:0"><div class="mu">باید بدهم</div><b style="font-size:20px;color:var(--bad)">${fa(b)}</b></div></div>`;
o+=`<div class="card"><div class="chips"><button class="chip ${ddir==='gave'?'on':''}" data-dir="gave">به کسی قرض دادم</button><button class="chip ${ddir==='got'?'on':''}" data-dir="got">از کسی قرض گرفتم</button></div><input id="dw" placeholder="نام شخص"><input id="da" data-n inputmode="numeric" placeholder="مبلغ"><input id="dn" placeholder="یادداشت (اختیاری)"><div class="mu" style="margin-top:8px">موعد بازگشت (اختیاری)</div><input type="date" id="dt"><button class="btn" id="adddebt">ذخیره</button></div>`;
o+='<h2>باز</h2><div class="card">'+(act.length?act.map(R).join(''):'<div class="empty">قرض بازی نداری.</div>')+'</div>';
if(old.length)o+='<h2>تسویه‌شده</h2><div class="card" style="opacity:.6">'+old.map(R).join('')+'</div>';
return o}
function insts(){const now=noon();
const L=S.inst.map(i=>({i,d:nextDue(i)})).filter(x=>x.d).sort((a,b)=>a.d-b.d);
let o=`<h1>اقساط بانکی</h1><div class="card"><div class="mu">قسط جدید</div><input id="ib" placeholder="نام بانک (مثلاً ملی)"><input id="ia" data-n inputmode="numeric" placeholder="مبلغ قسط"><div class="row" style="margin-top:6px"><input id="iy" inputmode="numeric" placeholder="روز ماه (مثلاً ۲۶)"><input id="in" inputmode="numeric" placeholder="قسط باقی‌مانده (اختیاری)"></div><button class="btn" id="addinst">ذخیره قسط</button><div class="mu" style="margin-top:6px">هر ماه در همان روز سررسید می‌شود و یادآوری می‌گیری.</div></div><h2>سررسید بعدی</h2><div class="card">`;
if(!L.length)o+='<div class="empty">هنوز قسطی ثبت نکرده‌ای.</div>';
L.forEach(({i,d})=>{const l=Math.round((d-now)/MN);o+=`<div class="tx row"><div class="ic">🏦</div><div class="grow"><div class="nt">${i.bank}</div><div class="mu">${fd(d)} - <span style="${l<0?'color:var(--bad)':''}">${lt(l)}</span>${i.n?' - باقی: '+fa(i.n)+' قسط':''}</div></div><div style="text-align:left"><b>${fa(i.a)}</b><br><button class="chip" data-ip="${i.id}">پرداخت شد</button></div><button class="del" data-ix="${i.id}">✕</button></div>`});
return o+'</div>'}
$('#app').oninput=e=>{if(e.target.dataset.n!==undefined){const v=dig(e.target.value);e.target.value=v?(+v).toLocaleString('fa-IR'):''}};
function suggest(txt){
const w=txt.trim().split(/\s+/).filter(x=>x.length>1);if(!w.length)return null;
for(const t of [...S.tx].sort((a,b)=>b.t-a.t)){if(t.n&&w.some(x=>t.n.includes(x)))return t.c}
for(const c of S.cats){if(c.k&&w.some(x=>c.k.split(' ').some(k=>k&&(x.includes(k)||k.includes(x)))))return c.id}
return null}
function cats(){$('#cats').innerHTML=S.cats.map(c=>`<button class="cat ${c.id===sel?'on':''}" data-c="${c.id}"><b>${c.e}</b>${c.n}</button>`).join('')}
function openSheet(){sel='other';touched=false;$('#amt').value='';$('#note').value='';$('#hint').textContent='';$('#unitl').textContent=U();
const d=new Date();d.setMinutes(d.getMinutes()-d.getTimezoneOffset());$('#when').value=d.toISOString().slice(0,16);
const f={};S.tx.forEach(t=>{const k=t.a;f[k]=(f[k]||0)+1});
$('#quick').innerHTML=Object.entries(f).sort((a,b)=>b[1]-a[1]).slice(0,4).map(([a])=>`<button class="chip" data-q="${a}">${fa(a)}</button>`).join('');
cats();$('#sheet').classList.add('on');setTimeout(()=>$('#amt').focus(),50)}
const close=()=>$('#sheet').classList.remove('on');
function notify(t,b){try{if('Notification' in window&&Notification.permission==='granted')new Notification(t,{body:b})}catch(e){}}
$('#fab').onclick=openSheet;$('#cancel').onclick=close;
$('#sheet').onclick=e=>{if(e.target.id==='sheet')close()};
$('#amt').oninput=e=>{const v=dig(e.target.value);e.target.value=v?(+v).toLocaleString('fa-IR'):''};
$('#note').oninput=e=>{const c=suggest(e.target.value);if(c&&!touched){sel=c;cats();$('#hint').textContent='دسته پیشنهادی: '+catOf(c).e+' '+catOf(c).n}};
$('#quick').onclick=e=>{const q=e.target.dataset.q;if(q)$('#amt').value=(+q).toLocaleString('fa-IR')};
$('#cats').onclick=e=>{const b=e.target.closest('.cat');if(b){sel=b.dataset.c;touched=true;cats()}};
$('#save').onclick=()=>{const a=+dig($('#amt').value);if(!a){toast('مبلغ را وارد کن');return}
const t=$('#when').value?new Date($('#when').value).getTime():Date.now();
S.tx.push({id:Date.now()+''+Math.floor(Math.random()*99),a,c:sel,n:$('#note').value.trim(),t});save();close();view='home';render();toast('ثبت شد: '+fa(a)+' '+U());
const b=+S.s.budget,m=sum(S.tx.filter(x=>inMonth(x)));if(b>0&&m>=b*.8)notify('بودجه ماهانه',m>b?'از بودجه این ماه گذشتی.':'بیش از ۸۰٪ بودجه این ماه خرج شده.')};
document.querySelector('nav').onclick=e=>{const b=e.target.closest('button');if(b){view=b.dataset.v;render()}};
$('#app').onclick=e=>{const t=e.target,d=t.dataset;
if(d.d&&confirm('این ثبت حذف شود؟')){S.tx=S.tx.filter(x=>x.id!==d.d);save();render()}
if(d.r){range=d.r;render()}
if(d.th){S.s.theme=d.th;save();render()}
if(d.ac){S.s.ac=d.ac;save();render()}
if(t.id==='addc'){const n=$('#nn').value.trim();if(n){S.cats.splice(S.cats.length-1,0,{id:'c'+Date.now(),n,e:$('#ne').value.trim()||'🔖',k:n});save();render()}}
if(t.id==='bk'){const j=JSON.stringify(S);(navigator.clipboard?navigator.clipboard.writeText(j):Promise.reject()).then(()=>toast('پشتیبان کپی شد')).catch(()=>prompt('این متن را کپی کن:',j))}
if(t.id==='rs'){const j=prompt('متن پشتیبان را بچسبان:');if(j){try{const o=JSON.parse(j);if(Array.isArray(o.tx)){S=Object.assign({},DEF,o);save();render();toast('بازیابی شد')}}catch(x){toast('متن معتبر نیست')}}}
if(t.id==='clr'&&confirm('همه ثبت‌ها پاک شوند؟')){S.tx=[];save();render()}
if(d.dir){ddir=d.dir;document.querySelectorAll('[data-dir]').forEach(b=>b.classList.toggle('on',b.dataset.dir===ddir))}
if(t.id==='adddebt'){const w=$('#dw').value.trim(),a=+dig($('#da').value);if(!w||!a){toast('نام و مبلغ را وارد کن');return}
S.debts.push({id:Date.now()+'',who:w,a,left:a,dir:ddir,note:$('#dn').value.trim(),t:Date.now(),due:$('#dt').value});save();render();toast('ثبت شد')}
if(d.pay){const x=S.debts.find(y=>y.id===d.pay),v=prompt('چقدر تسویه شد؟',x.left);if(v!==null){x.left=Math.max(0,x.left-(+dig(v)||0));save();render()}}
if(d.dd&&confirm('این مورد حذف شود؟')){S.debts=S.debts.filter(y=>y.id!==d.dd);save();render()}
if(t.id==='addinst'){const b=$('#ib').value.trim(),a=+dig($('#ia').value),dy=+dig($('#iy').value),n=+dig($('#in').value)||0;
if(!b||!a||dy<1||dy>31){toast('بانک، مبلغ و روز ماه (۱ تا ۳۱) را وارد کن');return}
S.inst.push({id:Date.now()+'',bank:b,a,day:dy,n,paid:[]});save();render();toast('قسط ثبت شد');if('Notification' in window&&Notification.permission==='default')Notification.requestPermission()}
if(d.ip){const i=S.inst.find(y=>y.id===d.ip),due=nextDue(i);if(due&&confirm('قسط '+i.bank+' پرداخت شد؟')){i.paid.push(mk(due));S.tx.push({id:Date.now()+'x',a:i.a,c:'other',n:'قسط '+i.bank,t:Date.now()});if(i.n){i.n--;if(i.n<=0)S.inst=S.inst.filter(y=>y!==i)}save();render();toast('ثبت شد و به خرج‌ها هم اضافه شد')}}
if(d.ix&&confirm('این قسط حذف شود؟')){S.inst=S.inst.filter(y=>y.id!==d.ix);save();render()}};
$('#app').onchange=e=>{const t=e.target;
if(t.id==='bud'){S.s.budget=+dig(t.value)||0;t.value=S.s.budget?fa(S.s.budget):'';save()}
if(t.id==='unit'){S.s.unit=t.value.trim()||'تومان';save()}
if(t.id==='rem'){S.s.remind=t.checked;save();if(t.checked&&'Notification' in window)Notification.requestPermission().then(p=>{if(p!=='granted')toast('اجازه اعلان داده نشد')})}
if(t.id==='rt'){S.s.rtime=t.value;save()}
if(t.id==='it'){S.s.itime=t.value;save()}};
setInterval(()=>{const n=new Date(),hm=String(n.getHours()).padStart(2,'0')+':'+String(n.getMinutes()).padStart(2,'0');
if(S.s.remind&&hm===S.s.rtime&&S.s.lastR!==dk(n)){S.s.lastR=dk(n);save();notify('خرج‌یار','امروز خرجی ثبت نکرده‌ای؟ همین الان بنویس.')}dueCheck(hm,n)},30000);
if(location.hash==='#add')setTimeout(openSheet,200);
render();
</script>
</body>
</html>
