<style>
:root{--bg:#F2F2F7;--sf:#fff;--tx:#1C1C1E;--mu:#8E8E93;--ln:#E5E5EA;--nv:rgba(255,255,255,.85);--ac:#0E9F8E;--bad:#FF3B30;--wn:#FF9500;--ok:#34C759;--r:22px;--nb:calc(84px + env(safe-area-inset-bottom,0px));box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#000;--sf:#1C1C1E;--tx:#F2F2F7;--ln:#2C2C2E;--nv:rgba(28,28,30,.85);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#000;--sf:#1C1C1E;--tx:#F2F2F7;--ln:#2C2C2E;--nv:rgba(28,28,30,.85);color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--tx);font-family:Vazirmatn,system-ui,Tahoma,sans-serif;font-size:15px;line-height:1.6;transition:background .4s}
body.nos{overflow:hidden;height:100dvh}
main{max-width:520px;margin:0 auto;padding:14px 16px calc(var(--nb) + 16px)}
main.home{height:calc(100dvh - var(--nb) - env(safe-area-inset-top,0px));padding:10px 14px 0;display:flex;flex-direction:column;gap:10px;overflow:hidden}
h1{font-size:28px;font-weight:800;margin:6px 0 14px}
h2{font-size:14px;color:var(--mu);font-weight:600;margin:20px 4px 8px}
.card{background:var(--sf);border-radius:var(--r);padding:16px;margin-bottom:14px;transition:background .4s}
.hero{color:#fff;background:var(--ac);background:linear-gradient(135deg,var(--ac),color-mix(in srgb,var(--ac) 50%,#000));box-shadow:0 10px 24px rgba(0,0,0,.18)}
.hh{display:flex;justify-content:space-between;align-items:center;padding:10px 16px;margin:0}
.hl{font-size:12px;opacity:.85}
.big{font-size:32px;font-weight:800;line-height:1.25}
.big small{font-size:13px;font-weight:400;opacity:.85}
.mu{color:var(--mu);font-size:13px}
.row{display:flex;align-items:center;gap:10px}
.sp{justify-content:space-between}
.grow{flex:1;min-width:0}
.nt{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar{height:8px;background:var(--ln);border-radius:8px;overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;background:var(--ac);border-radius:8px}
.tx{padding:10px 0;border-bottom:1px solid var(--ln)}
.tx:last-child{border:0}
.ic{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;font-size:21px;flex:none}
.gear{background:var(--sf);border:0;width:42px;height:42px;border-radius:50%;font-size:18px;color:var(--tx);cursor:pointer}
.gear:active,.chip:active,.btn:active,.bc:active{transform:scale(.95)}
button,.bc,.ws{transition:transform .15s}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
nav{position:fixed;inset-inline:12px;bottom:calc(10px + env(safe-area-inset-bottom,0px));max-width:496px;margin:auto;background:var(--nv);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);border-radius:30px;display:flex;padding:6px;box-shadow:0 6px 24px rgba(0,0,0,.16);z-index:5}
#ind{position:absolute;top:6px;bottom:6px;left:0;width:0;border-radius:24px;background:color-mix(in srgb,var(--ac) 18%,transparent);transition:transform .38s cubic-bezier(.3,1.25,.5,1),width .38s,background .3s,opacity .2s}
nav button{flex:1;position:relative;z-index:1;background:none;border:0;color:var(--mu);font:inherit;font-size:10.5px;display:grid;justify-items:center;padding:5px 0;min-height:48px;border-radius:22px;cursor:pointer;transition:color .25s}
nav button b{font-size:20px;font-weight:400;line-height:1.3;transition:transform .3s}
nav button.on{color:var(--ac);font-weight:700}
nav button.on b{animation:bob .45s}
@keyframes bob{0%{transform:scale(1)}40%{transform:scale(1.35) translateY(-3px)}100%{transform:scale(1)}}
@keyframes up{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes pg{from{opacity:0;transform:translateX(var(--dx,0))}to{opacity:1;transform:none}}
main.view{animation:pg .32s cubic-bezier(.2,.8,.2,1)}
main.view>*{animation:up .45s cubic-bezier(.2,.8,.2,1) both}
main.view>*:nth-child(2){animation-delay:.05s}main.view>*:nth-child(3){animation-delay:.1s}main.view>*:nth-child(4){animation-delay:.15s}main.view>*:nth-child(5){animation-delay:.2s}main.view>*:nth-child(n+6){animation-delay:.25s}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.fab{position:fixed;bottom:calc(var(--nb) + 4px);inset-inline-start:16px;width:58px;height:58px;border-radius:50%;border:0;background:var(--ac);color:#fff;font-size:32px;box-shadow:0 8px 20px rgba(0,0,0,.28);z-index:6;cursor:pointer;transition:background .3s,transform .15s}
.fab:active{transform:scale(.9) rotate(90deg)}
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:10;display:none;align-items:flex-end}
.sheet.on{display:flex}
.sheet.on .pane{animation:sl .3s cubic-bezier(.2,.8,.2,1)}
@keyframes sl{from{transform:translateY(60px);opacity:0}to{transform:none;opacity:1}}
.pane{background:var(--bg);width:100%;max-width:520px;margin:0 auto;border-radius:28px 28px 0 0;padding:18px 16px calc(16px + env(safe-area-inset-bottom,0px));max-height:94dvh;overflow:auto}
#amt{width:100%;border:0;background:none;color:var(--tx);font:inherit;font-size:46px;font-weight:800;text-align:center;outline:0;direction:ltr;padding:0}
input,select,textarea{font:inherit;color:var(--tx);background:var(--sf);border:0;border-radius:calc(var(--r) - 8px);padding:11px 14px;width:100%}
textarea{resize:none}
input[type=range]{padding:0;background:none;accent-color:var(--ac)}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:10px 0}
.cat{background:var(--sf);border:2px solid transparent;border-radius:calc(var(--r) - 6px);padding:8px 2px;text-align:center;font-size:12px;cursor:pointer;color:var(--tx);font-family:inherit}
.cat b{display:block;font-size:24px;font-weight:400}
.cat.on{border-color:var(--ac)}
.btn{background:var(--ac);color:#fff;border:0;border-radius:calc(var(--r) - 6px);padding:14px;width:100%;font:inherit;font-weight:600;font-size:16px;cursor:pointer;margin-top:10px}
.btn.g{background:var(--sf);color:var(--tx)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0}
.chip{background:var(--sf);border:0;border-radius:20px;padding:5px 14px;font-size:13px;cursor:pointer;color:var(--tx);font-family:inherit;min-height:32px}
.chip.on{background:var(--ac);color:#fff}
.cols{display:flex;align-items:flex-end;gap:3px;height:110px}
.cols div{flex:1;text-align:center;font-size:10px;color:var(--mu);display:flex;flex-direction:column;justify-content:flex-end;height:100%}
.cols i{display:block;background:var(--ac);border-radius:6px 6px 2px 2px;min-height:3px;margin-bottom:3px;opacity:.85}
.sq{display:inline-block;width:10px;height:10px;border-radius:3px}
.bento{flex:1;min-height:0;display:grid;grid-template-columns:1fr 1fr;grid-auto-rows:minmax(0,1fr);gap:10px}
.bento>:last-child:nth-child(odd){grid-column:span 2}
.bc{background:var(--sf);border-radius:var(--r);padding:8px 8px 6px;display:flex;flex-direction:column;align-items:center;min-height:0;overflow:hidden;cursor:pointer;text-align:center}
.bl{font-size:12px;color:var(--mu);line-height:1.4}
.bs{font-size:12px;font-weight:600;line-height:1.3;max-width:100%}
.bw{flex:1;min-height:0;width:100%;display:flex;justify-content:center}
.bw svg{height:100%;width:auto;max-width:100%}
.ws{margin:0;margin-inline-end:70px;padding:10px 12px;cursor:pointer}
.wrow{display:flex;gap:4px;margin-top:6px}
.wd{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;position:relative;border-radius:12px;padding:3px 0}
.wd.td{background:color-mix(in srgb,var(--ac) 16%,transparent)}
.wb{height:32px;width:12px;display:flex;align-items:flex-end;background:var(--ln);border-radius:6px;overflow:hidden}
.wb i{width:100%;background:var(--ac);border-radius:6px;display:block;transition:height .6s}
.wn{font-size:11px;color:var(--mu)}.wn.fr{color:var(--bad)}
.wm{font-size:12px;line-height:1.2}
.pb{background:color-mix(in srgb,var(--ac) 14%,var(--sf));border-radius:16px;padding:8px 14px;font-size:13px;cursor:pointer;text-align:center}
.hs{display:flex;gap:12px;overflow-x:auto;padding:2px 2px 12px;scrollbar-width:none}
.rc{flex:none;width:158px;background:var(--sf);border-radius:var(--r);padding:14px 10px;text-align:center}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.cd{border:0;background:none;color:var(--tx);font:inherit;border-radius:50%;aspect-ratio:1;position:relative;cursor:pointer;padding:0}
.cd.td{background:var(--ac);color:#fff}
.cd.sl{outline:2px solid var(--ac)}
.cd.fr{color:var(--bad)}
.dt{position:absolute;bottom:3px;width:5px;height:5px;border-radius:50%}
.dt.s{background:var(--ac);left:calc(50% - 7px)}.dt.r{background:var(--bad);left:calc(50% + 2px)}
.td .dt.s{background:#fff}
.sw{position:relative;overflow:hidden;border-radius:14px}
.swc2{background:var(--sf);position:relative;touch-action:pan-y;transition:transform .25s cubic-bezier(.2,.8,.2,1)}
.swa{position:absolute;top:0;bottom:0;width:50%;display:flex;align-items:center;color:#fff;font-weight:600;font-size:14px;padding:0 18px;opacity:0;transition:opacity .15s}
.swa.e{left:0;background:#007AFF;justify-content:flex-start}
.swa.d{right:0;background:#FF3B30;justify-content:flex-end}
.sw[data-dir=e] .swa.e,.sw[data-dir=d] .swa.d{opacity:1}
.gh{padding:12px 4px 4px;font-size:13px;color:var(--mu)}
.swc{width:34px;height:34px;border-radius:50%;border:3px solid transparent;cursor:pointer}
.swc.on{border-color:var(--tx)}
.clr{width:34px;height:34px;padding:0;border:0;border-radius:50%;background:none}
.tg{-webkit-appearance:none;appearance:none;width:51px;height:31px;border-radius:16px;background:var(--ln);position:relative;border:0;padding:0;flex:none;transition:background .25s}
.tg::after{content:"";position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:.25s}
.tg:checked{background:var(--ok)}.tg:checked::after{left:22px}
.toast{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));inset-inline:16px;margin:auto;max-width:400px;background:var(--tx);color:var(--bg);padding:10px 14px;border-radius:16px;z-index:20;text-align:center;display:none}
.toast button{background:none;border:0;color:var(--ac);font:inherit;font-weight:700;margin-inline-start:8px;cursor:pointer}
.empty{text-align:center;color:var(--mu);padding:22px 8px}
.del{background:none;border:0;color:var(--mu);font-size:17px;cursor:pointer;min-width:32px;min-height:32px}
summary{cursor:pointer;font-weight:600;color:var(--ac)}
details input,details .row{margin-top:8px}
.nc input,.nc textarea{background:transparent;padding:6px 2px;border-radius:0}
</style>
</head>
<body>
<main id="app"></main>
<button class="fab" id="fab" aria-label="ثبت خرج جدید">+</button>
<nav id="nav" aria-label="بخش‌های برنامه"></nav>
<div class="sheet" id="sheet"><div class="pane">
<div class="mu" style="text-align:center">مبلغ را وارد کن</div>
<input id="amt" inputmode="numeric" placeholder="۰" autocomplete="off" aria-label="مبلغ">
<div class="mu" style="text-align:center" id="unitl"></div>
<div class="chips" id="quick" style="justify-content:center"></div>
<input id="note" placeholder="برای چی بود؟ (مثلاً تاکسی، ناهار)" autocomplete="off" style="margin-top:8px">
<div class="mu" id="hint" style="margin:6px 2px;min-height:22px"></div>
<div class="grid" id="cats"></div>
<textarea id="memo" rows="2" placeholder="یادداشت (اختیاری)"></textarea>
<input type="datetime-local" id="when" style="margin-top:8px">
<button class="btn" id="save">ثبت</button>
<button class="btn g" id="cancel">بستن</button>
</div></div>
<div class="sheet" id="cs"><div class="pane" id="cp"></div></div>
<div class="toast" id="toast" role="status"></div>
<script>
const APP_VER=5;
const KEY='kharjyar-v1';
const ICON=document.querySelector('link[rel=apple-touch-icon]').href;
const PAL=['#FF9500','#34C759','#007AFF','#FF3B30','#AF52DE','#FF2D55','#5AC8FA','#FFCC00','#8E8E93','#64D2FF'];
const PM=['فروردین','اردیبهشت','خرداد','تیر','مرداد','شهریور','مهر','آبان','آذر','دی','بهمن','اسفند'];
const WS=['شن','یک','دو','سه','چه','پن','جم'];
const TABS=[['home','🏠','خانه'],['spend','🧾','خرج‌ها'],['stats','📊','تحلیل'],['debt','🤝','قرض'],['inst','🏦','قسط'],['notes','📝','یادداشت']];
const TC={spend:'#FF9500',stats:'#AF52DE',debt:'#FF2D55',inst:'#007AFF',notes:'#D9A400'};
const DEF={tx:[],debts:[],inst:[],notes:[],cats:[
['food','غذا','🍔','ناهار شام صبحانه رستوران کافه پیتزا ساندویچ قهوه چای غذا کباب برگر'],
['shop','خرید','🛒','سوپر میوه نان خرید فروشگاه بازار لبنیات'],
['ride','رفت‌وآمد','🚕','تاکسی اسنپ بنزین مترو اتوبوس کرایه تپسی پارکینگ'],
['bill','قبض','💡','قبض برق گاز آب اینترنت شارژ موبایل'],
['health','سلامت','💊','دارو دکتر داروخانه درمان دندان'],
['fun','تفریح','🎬','سینما بازی گیم پارک سفر'],
['edu','آموزش','📚','کتاب کلاس دوره دانشگاه کپی پرینت'],
['cloth','پوشاک','👕','لباس کفش کیف'],
['home','خانه','🏠','اجاره رهن وسایل تعمیر'],
['other','سایر','🧾','']].map((c,i)=>({id:c[0],n:c[1],e:c[2],k:c[3],col:PAL[i%PAL.length]})),
s:{theme:'auto',ac:'#0E9F8E',budget:0,unit:'تومان',remind:false,rtime:'21:00',lastR:'',itime:'09:00',lastI:'',title:'Mbook',rad:22,home:{sum:1,bud:1,cats:1,due:1,avg:1,week:1}}};
let S;try{S=JSON.parse(localStorage.getItem(KEY))}catch(e){}
function norm(){S=Object.assign({},DEF,S||{});S.s=Object.assign({},DEF.s,S.s);S.s.home=Object.assign({},DEF.s.home,S.s.home||{});S.cats.forEach((c,i)=>{c.col=c.col||PAL[i%PAL.length]})}
norm();
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fa=n=>Math.round(n).toLocaleString('fa-IR');
const pd=n=>String(n).replace(/\d/g,d=>'۰۱۲۳۴۵۶۷۸۹'[d]);
const dig=s=>s.replace(/[۰-۹]/g,d=>'۰۱۲۳۴۵۶۷۸۹'.indexOf(d)).replace(/[٠-٩]/g,d=>'٠١٢٣٤٥٦٧٨٩'.indexOf(d)).replace(/[^\d]/g,'');
const pj=d=>Object.fromEntries(new Intl.DateTimeFormat('en-u-ca-persian-nu-latn',{year:'numeric',month:'numeric',day:'numeric'}).formatToParts(d).map(x=>[x.type,+x.value]));
const dk=d=>d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate();
const mk=d=>{const p=pj(d);return p.year*13+p.month};
const catOf=id=>S.cats.find(c=>c.id===id)||S.cats[S.cats.length-1];
const fdate=d=>new Intl.DateTimeFormat('fa-IR-u-ca-persian',{weekday:'long',day:'numeric',month:'long'}).format(d);
const fd=d=>new Intl.DateTimeFormat('fa-IR-u-ca-persian',{day:'numeric',month:'long'}).format(d);
const ftime=d=>d.toLocaleTimeString('fa-IR',{hour:'2-digit',minute:'2-digit'});
const U=()=>S.s.unit;
const sum=a=>a.reduce((x,t)=>x+t.a,0);
const sl=a=>a.reduce((s,x)=>s+x.left,0);
const inMonth=(t,d=new Date())=>mk(new Date(t.t))===mk(d);
const MN=864e5;
const noon=()=>{const n=new Date();n.setHours(12,0,0,0);return n};
const wdi=d=>(d.getDay()+1)%7;
const weekDays=()=>{const n=noon(),s=new Date(+n-wdi(n)*MN);return Array.from({length:7},(_,i)=>new Date(+s+i*MN))};
const daySum=d=>sum(S.tx.filter(t=>dk(new Date(t.t))===dk(d)));
const lt=l=>l<0?fa(-l)+' روز گذشته':l===0?'امروز':l===1?'فردا':fa(l)+' روز دیگر';
const msg=x=>x.l<0?fa(-x.l)+' روز از موعد '+x.t+' گذشته':x.l===0?'امروز موعد '+x.t+' است':lt(x.l)+' موعد '+x.t;
let view='home',lastV='',range='week',sel='other',touched=false,ddir='gave',calOff=0,selDay=dk(new Date()),qry='',pendId=null,editId=null;
const op={};
function toast(t,u){const e=$('#toast');e.innerHTML=esc(t)+(u?' <button id="undo">بازگردانی</button>':'');e.style.display='block';toast.u=u;clearTimeout(toast.t);toast.t=setTimeout(()=>e.style.display='none',u?6000:3200)}
$('#toast').onclick=e=>{if(e.target.id==='undo'&&toast.u){toast.u();toast.u=null;$('#toast').style.display='none'}};
function theme(){const r=document.documentElement;S.s.theme==='auto'?r.removeAttribute('data-theme'):r.setAttribute('data-theme',S.s.theme);r.style.setProperty('--ac',TC[view]||S.s.ac);r.style.setProperty('--r',S.s.rad+'px')}
function matchDay(d,day){const p=pj(d),n=pj(new Date(+d+MN));return p.day===day||(n.month!==p.month&&day>p.day)}
function nextDue(i){const now=noon(),p=pj(now);i.paid=i.paid||[];
for(let k=-(p.day-1);k<75;k++){const d=new Date(+now+k*MN);if(matchDay(d,i.day)&&!i.paid.includes(mk(d)))return d}return null}
function dueItems(){const now=noon(),r=[];
S.inst.forEach(i=>{const d=nextDue(i);if(d){const l=Math.round((d-now)/MN);r.push({k:'inst',id:i.id,t:'قسط '+i.bank,a:i.a,l,p:1-Math.max(0,Math.min(30,l))/30,d})}});
S.debts.forEach(x=>{if(x.due&&x.left>0){const d=new Date(x.due+'T12:00:00'),l=Math.round((d-now)/MN),tot=Math.max(1,(d-x.t)/MN);r.push({k:'debt',id:x.id,t:(x.dir==='gave'?'طلب از ':'بدهی به ')+x.who,a:x.left,l,p:Math.max(0,Math.min(1,1-l/tot)),d})}});
return r.sort((a,b)=>a.l-b.l)}
const lc=l=>l<=3?'var(--bad)':l<=7?'var(--wn)':'var(--ok)';
function rg(segs,ctr,fs){let a=0;const arcs=segs.filter(s=>s.v>0).map(s=>{const l=Math.max(0,Math.min(100-a,s.v));const x=`<circle cx="18" cy="18" r="14.5" fill="none" stroke="${s.c}" stroke-width="4" stroke-linecap="${segs.length>1?'butt':'round'}" pathLength="100" stroke-dasharray="${l} 100" stroke-dashoffset="${-a}" transform="rotate(-90 18 18)"/>`;a+=l;return x}).join('');
const f=fs||(String(ctr).length>7?4:String(ctr).length>4?5.5:7.5);
return `<svg viewBox="0 0 36 36"><circle cx="18" cy="18" r="14.5" fill="none" stroke="var(--ln)" stroke-width="4"/>${arcs}<text x="18" y="${18+f*.36}" text-anchor="middle" font-size="${f}" font-weight="700" fill="var(--tx)">${ctr}</text></svg>`}
function ring(x,z){return `<div style="width:${z}px;height:${z}px;flex:none">${rg([{v:Math.max(4,x.p*100),c:lc(x.l)}],x.l<0?'!':fa(x.l))}</div>`}
function row(t){const c=catOf(t.c),d=new Date(t.t);return `<div class="tx row"><div class="ic" style="background:${c.col}26">${c.e}</div><div class="grow"><div class="nt">${esc(t.n||c.n)}</div><div class="mu nt">${c.n} - ${ftime(d)}${t.m?' - 📝 '+esc(t.m):''}</div></div><b>${fa(t.a)}</b></div>`}
function swrow(t){return `<div class="sw" data-sid="${t.id}"><div class="swa e">✏️ ویرایش</div><div class="swa d">🗑 حذف</div><div class="swc2">${row(t)}</div></div>`}
function barsD(dates,lab){const v=dates.map(d=>daySum(d)),mx=Math.max(1,...v);return `<div class="cols">${dates.map((d,i)=>`<div><i style="height:${v[i]/mx*78}px"></i>${lab(d,i)}</div>`).join('')}</div>`}
function dn(items,sz){const tot=items.reduce((s,x)=>s+x.v,0);if(!tot)return '<div class="empty">داده‌ای برای نمایش نیست.</div>';
const it=items.filter(x=>x.v>0);
return `<div class="row" style="gap:14px"><div style="width:${sz||104}px;height:${sz||104}px;flex:none">${rg(it.map(x=>({v:x.v/tot*100,c:x.c})),fa(tot))}</div><div class="grow">${it.slice(0,6).map(x=>`<div class="row sp" style="margin:2px 0;font-size:13px"><span class="nt"><i class="sq" style="background:${x.c}"></i> ${x.l}</span><span class="mu">${fa(x.v/tot*100)}٪</span></div>`).join('')}</div></div>`}
function catItems(list){const by={};list.forEach(t=>by[t.c]=(by[t.c]||0)+t.a);return Object.entries(by).sort((a,b)=>b[1]-a[1]).map(([id,v])=>({l:catOf(id).n,v,c:catOf(id).col,e:catOf(id).e}))}
function monthInfo(off){let d=noon();while(pj(d).day>1)d=new Date(+d-MN);
for(let i=0;i<Math.abs(off);i++){if(off<0){d=new Date(+d-MN);while(pj(d).day>1)d=new Date(+d-MN)}else{do{d=new Date(+d+MN)}while(pj(d).day>1)}}
let n=0,e=new Date(+d);while(pj(e).month===pj(d).month){n++;e=new Date(+e+MN)}return{start:d,len:n,p:pj(d)}}
function cal(){const mi=monthInfo(calOff),off=wdi(mi.start),t=dk(new Date());
let o=`<div class="row sp"><button class="gear" data-cm="-1" aria-label="ماه قبل">›</button><b>${PM[mi.p.month-1]} ${pd(mi.p.year)}</b><button class="gear" data-cm="1" aria-label="ماه بعد">‹</button></div><div class="cal" style="margin-top:8px">${WS.map((x,i)=>`<div class="mu" style="${i===6?'color:var(--bad)':''}">${x}</div>`).join('')}${'<div></div>'.repeat(off)}`;
for(let i=0;i<mi.len;i++){const d=new Date(+mi.start+i*MN),k=dk(d),sp=S.tx.some(x=>dk(new Date(x.t))===k),du=S.inst.some(x=>matchDay(d,x.day))||S.debts.some(x=>x.left>0&&x.due&&dk(new Date(x.due+'T12:00:00'))===k);
o+=`<button class="cd ${k===t?'td':''} ${k===selDay?'sl':''} ${(off+i)%7===6?'fr':''}" data-cd="${k}">${pd(i+1)}${sp?'<i class="dt s"></i>':''}${du?'<i class="dt r"></i>':''}</button>`}
const L=S.tx.filter(x=>dk(new Date(x.t))===selDay).sort((a,b)=>b.t-a.t);
return o+`</div><div class="mu" style="margin:8px 0 0">● خرج &nbsp; <span style="color:var(--bad)">●</span> سررسید قسط یا وام</div><div style="margin-top:6px">${L.length?`<div class="row sp mu" style="margin-top:6px"><span>مجموع این روز</span><b>${fa(sum(L))}</b></div>`+L.map(row).join(''):'<div class="mu" style="text-align:center;padding:8px">برای این روز خرجی ثبت نشده</div>'}</div><button class="btn g" data-cc="1">بستن</button>`}
function openCal(){$('#cp').innerHTML=cal();$('#cs').classList.add('on')}
function parseN(n){const s=((n.title||'')+' '+(n.text||'')).replace(/[۰-۹]/g,d=>'۰۱۲۳۴۵۶۷۸۹'.indexOf(d));
if(!/برداشت|خرید|پرداخت|کسر|انتقال|کارت به کارت|پایا|ساتنا|پوز/.test(s)||/واریز|دریافت|افزایش موجودی/.test(s))return null;
const b=s.split(/مانده|موجودی/)[0].replace(/[*•]+\s*\d{3,4}|\d{3,4}\s*[*•]+/g,' ').replace(/\d{2,4}[\/:]\d{1,2}([\/:]\d{1,2})?/g,' ');
const m=(b.match(/(?<!\d)\d{1,3}(?:[,٬،]\d{3})+(?!\d)|(?<!\d)\d{4,11}(?!\d)/g)||[]).map(x=>+x.replace(/[,٬،]/g,'')).filter(v=>v>=1000);
if(!m.length)return null;let a=m[0];if(U()==='تومان'&&!/تومان/.test(s))a=a/10;
return{id:n.id,a:Math.round(a),n:((n.title&&n.title.length<30)?n.title:s.trim().slice(0,40)).trim(),t:n.t}}
function pendList(){try{if(window.Android&&Android.pending){const r=[];JSON.parse(Android.pending()).forEach(n=>{const p=parseN(n);if(p)r.push(p);else Android.removePending(n.id)});return r}}catch(e){}return[]}
function rmPend(id){try{Android.removePending(id)}catch(e){}}
function pendCard(){const pn=pendList();if(!pn.length)return '';
return `<div class="card"><div class="mu" style="margin-bottom:4px">🔔 تراکنش‌های اعلان بانک (${fa(pn.length)})</div>${pn.slice(0,5).map(p=>`<div class="tx row"><div class="grow"><b>${fa(p.a)} ${U()}</b><div class="mu nt">${esc(p.n)} - ${ftime(new Date(p.t))}</div></div><button class="chip" data-pa="${esc(p.id)}">ثبت</button><button class="del" data-pd="${esc(p.id)}" aria-label="رد کردن">✕</button></div>`).join('')}</div>`}
function notifSec(){const A=window.Android;
if(!(A&&A.seen))return '<h2>اعلان‌های بانک</h2><div class="card mu">این قابلیت فقط در برنامهٔ اندروید کار می‌کند.</div>';
let seen={},al=[];try{seen=JSON.parse(A.seen());al=JSON.parse(A.allowed())}catch(e){}
const ok=A.hasAccess();
return `<h2>اعلان‌های بانک</h2><div class="card"><div class="row sp"><span>دسترسی به اعلان‌ها</span><b style="color:${ok?'var(--ok)':'var(--bad)'}">${ok?'فعال':'غیرفعال'}</b></div><button class="btn g" data-na="1">${ok?'تنظیمات دسترسی':'فعال کردن دسترسی'}</button><div class="mu" style="margin:10px 0 4px">اپ بانکت را از لیست انتخاب کن. لیست از اعلان‌هایی ساخته می‌شود که تازه رسیده‌اند.</div>${Object.keys(seen).length?Object.entries(seen).map(([p,l])=>`<div class="row sp tx"><span class="nt">${esc(l)}<div class="mu">${esc(p)}</div></span><input type="checkbox" class="tg" data-ap="${esc(p)}" ${al.includes(p)?'checked':''}></div>`).join(''):'<div class="mu">هنوز اعلانی ندیده‌ام. بعد از دادن دسترسی، یک اعلان از اپ بانک بگیر و این صفحه را دوباره باز کن.</div>'}</div>`}
const hd=t=>`<div class="row sp"><h1>${t}</h1><button class="gear" data-v="set" aria-label="تنظیمات">⚙️</button></div>`;
function home(){const now=new Date(),H=S.s.home,td=daySum(now),m=sum(S.tx.filter(t=>inMonth(t))),b=+S.s.budget,dn0=pj(now).day,avg=m/dn0,pn=pendList().length;
let o=`<div class="row sp"><div class="row"><img src="${ICON}" width="34" height="34" alt=""><div><b style="font-size:18px;line-height:1.2">${esc(S.s.title)}</b><div class="mu">${fdate(now)}</div></div></div><button class="gear" data-v="set" aria-label="تنظیمات">⚙️</button></div>`;
if(pn)o+=`<div class="pb" data-v="spend">🔔 ${fa(pn)} تراکنش از اعلان بانک منتظر تأیید است</div>`;
if(H.sum)o+=`<div class="card hero hh"><div><div class="hl">خرج امروز</div><div class="big">${fa(td)} <small>${U()}</small></div></div><div style="text-align:left"><div class="hl">این ماه</div><b style="font-size:17px">${fa(m)}</b></div></div>`;
let c='';
if(H.bud){const p=b?m/b:0,col=p>=1?'var(--bad)':p>.8?'var(--wn)':'var(--ok)';c+=`<div class="bc" data-v="${b?'stats':'set'}"><div class="bl">بودجهٔ ماه</div><div class="bw">${rg([{v:Math.min(100,p*100),c:col}],b?fa(p*100)+'٪':'—')}</div><div class="bs">${b?(m>b?fa(m-b)+' بیشتر':fa(b-m)+' مانده'):'بودجه بگذار'}</div></div>`}
if(H.cats){const it=catItems(S.tx.filter(t=>inMonth(t))),tot=sum(S.tx.filter(t=>inMonth(t)));c+=`<div class="bc" data-v="stats"><div class="bl">دسته‌ها</div><div class="bw">${rg(it.map(x=>({v:x.v/tot*100,c:x.c})),it[0]?it[0].e:'—',9)}</div><div class="bs">${it[0]?it[0].l+' '+fa(it[0].v/tot*100)+'٪':'هنوز خرجی نیست'}</div></div>`}
if(H.due){const x=dueItems()[0];c+=`<div class="bc" data-v="inst"><div class="bl">سررسید بعدی</div><div class="bw">${x?rg([{v:Math.max(4,x.p*100),c:lc(x.l)}],x.l<0?'!':fa(x.l),9):rg([],'✓',9)}</div><div class="bs nt">${x?esc(x.t)+' - '+lt(x.l):'سررسیدی نداری'}</div></div>`}
if(H.avg){const p=avg?td/avg:0;c+=`<div class="bc" data-v="spend"><div class="bl">امروز نسبت به میانگین</div><div class="bw">${rg([{v:Math.min(100,p*100),c:p>1?'var(--bad)':'var(--ac)'}],avg?fa(p*100)+'٪':'—')}</div><div class="bs">میانگین روزانه: ${fa(avg)}</div></div>`}

if(d.pay){const x=S.debts.find(y=>y.id===d.pay),v=prompt('چقدر تسویه شد؟',x.left);if(v!==null){x.left=Math.max(0,x.left-(+dig(v)||0));save();render(1)}}
if(d.dd&&confirm('این مورد حذف شود؟')){S.debts=S.debts.filter(y=>y.id!==d.dd);save();render(1)}
if(t.id==='addinst'){const b=$('#ib').value.trim(),a=+dig($('#ia').value),dy=+dig($('#iy').value),n=+dig($('#in').value)||0;
if(!b||!a||dy<1||dy>31){toast('بانک، مبلغ و روز ماه (۱ تا ۳۱) را وارد کن');return}
S.inst.push({id:Date.now()+'',bank:b,a,day:dy,n,paid:[]});save();render(1);toast('قسط ثبت شد');if('Notification' in window&&Notification.permission==='default')Notification.requestPermission()}
if(d.ip){const i=S.inst.find(y=>y.id===d.ip),due=nextDue(i);if(due&&confirm('قسط '+i.bank+' پرداخت شد؟')){i.paid.push(mk(due));if(i.n){i.n--;if(i.n<=0)S.inst=S.inst.filter(y=>y!==i)}save();render(1);toast('پرداخت ثبت شد')}}
if(d.ix&&confirm('این قسط حذف شود؟')){S.inst=S.inst.filter(y=>y.id!==d.ix);save();render(1)}
if(t.id==='addnote'){const ti=$('#nt').value.trim(),b=$('#nb').value.trim();if(!ti&&!b){toast('چیزی بنویس');return}S.notes.unshift({id:Date.now()+'',ti,b,t:Date.now(),pin:0});save();render(1)}
if(d.np){const n=S.notes.find(x=>x.id===d.np);n.pin=n.pin?0:1;save();render(1)}
if(d.nd&&confirm('این یادداشت حذف شود؟')){S.notes=S.notes.filter(x=>x.id!==d.nd);save();render(1)}};
$('#app').oninput=e=>{const t=e.target;if(t.dataset.n!==undefined){const v=dig(t.value);t.value=v?(+v).toLocaleString('fa-IR'):''}
if(t.id==='rad'){S.s.rad=+t.value;save();theme()}
if(t.id==='q'){qry=t.value;$('#sl').innerHTML=spendList()}};
$('#app').onchange=e=>{const t=e.target;
if(t.dataset.hs){S.s.home[t.dataset.hs]=t.checked?1:0;save()}
if(t.dataset.ap){try{let al=JSON.parse(Android.allowed());al=t.checked?[...new Set([...al,t.dataset.ap])]:al.filter(x=>x!==t.dataset.ap);Android.setAllowed(JSON.stringify(al))}catch(e){}}
if(t.dataset.nf){const n=S.notes.find(x=>x.id===t.dataset.ni);if(n){n[t.dataset.nf]=t.value;save()}}
if(t.id==='acc'){S.s.ac=t.value;save();render(1)}
if(t.id==='ttl'){S.s.title=t.value.trim()||'Mbook';save()}
if(t.id==='bud'){S.s.budget=+dig(t.value)||0;t.value=S.s.budget?fa(S.s.budget):'';save()}
if(t.id==='unit'){S.s.unit=t.value.trim()||'تومان';save()}
if(t.id==='rem'){S.s.remind=t.checked;save();if(t.checked&&'Notification' in window)Notification.requestPermission().then(p=>{if(p!=='granted')toast('اجازه اعلان داده نشد')})}
if(t.id==='rt'){S.s.rtime=t.value;save()}
if(t.id==='it'){S.s.itime=t.value;save()}};
let sw=null;
document.addEventListener('pointerdown',e=>{const r=e.target.closest('.swc2');if(r)sw={r,x:e.clientX,y:e.clientY,dx:0,on:false,id:r.parentNode.dataset.sid}});
document.addEventListener('pointermove',e=>{if(!sw)return;const dx=e.clientX-sw.x,dy=e.clientY-sw.y;
if(!sw.on){if(Math.abs(dx)>10&&Math.abs(dx)>Math.abs(dy)*1.5){sw.on=true;sw.r.style.transition='none'}else return}
sw.dx=dx;sw.r.style.transform=`translateX(${dx}px)`;sw.r.parentNode.dataset.dir=dx>0?'e':'d'});
function swEnd(){if(!sw)return;const{r,dx,id,on}=sw;sw=null;if(!on)return;r.style.transition='';
if(dx>90){r.style.transform='';editTx(id)}else if(dx<-90){r.style.transform='translateX(-110%)';setTimeout(()=>delTx(id),200)}else r.style.transform=''}
document.addEventListener('pointerup',swEnd);document.addEventListener('pointercancel',swEnd);
setInterval(()=>{const n=new Date(),hm=String(n.getHours()).padStart(2,'0')+':'+String(n.getMinutes()).padStart(2,'0');
if(S.s.remind&&hm===S.s.rtime&&S.s.lastR!==dk(n)){S.s.lastR=dk(n);save();notify('Mbook','امروز خرجی ثبت نکرده‌ای؟ همین الان بنویس.')}dueCheck(hm,n)},30000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&(view==='home'||view==='spend'))render(1)});
buildNav();
window.addEventListener('resize',moveInd);
if(location.hash==='#add')setTimeout(()=>openSheet(),200);
render();
</script>
</body>
</html>
